name: update-flake-lock
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: |
          nix flake update --commit-lock-file
          git push origin HEAD   
